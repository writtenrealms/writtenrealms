x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    logging: *default-logging
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    command: sh -c "python manage.py migrate && python manage.py createcachetable && uvicorn backend.config.asgi:application --host 0.0.0.0 --port 8000"
    working_dir: /code/backend
    environment:
      - PYTHONPATH=/code
      # Local sign-in emails must appear immediately in docker compose logs.
      - PYTHONUNBUFFERED=1
      - WR_LLM_API_KEY=${WR_LLM_API_KEY:-}
      - WR_LLM_OPENAI_PROJECT=${WR_LLM_OPENAI_PROJECT:-}
      - INSTANCE_ID=container
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME}
      - SENTRY_DSN=${SENTRY_DSN}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - MONITORING_EMAIL=${MONITORING_EMAIL}
      - SYSTEM_EMAIL_FROM=${SYSTEM_EMAIL_FROM}
      - CHANNEL_REDIS_HOST=${CHANNEL_REDIS_HOST:-redis}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-amqp://rabbitmq:5672}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis-celery:6379/0}
      - WR_ITEM_UPKEEP_ENABLED=${WR_ITEM_UPKEEP_ENABLED:-true}
      - WR_DOOR_UPKEEP_ENABLED=${WR_DOOR_UPKEEP_ENABLED:-true}
      - COMMUNICATION_RETENTION_DAYS=${COMMUNICATION_RETENTION_DAYS:-3}
      - COMMUNICATION_PRUNE_BATCH_SIZE=${COMMUNICATION_PRUNE_BATCH_SIZE:-10000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      redis-celery:
        condition: service_started
  celery-worker:
    logging: *default-logging
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: sh -c "celery -A backend.config worker -l info -Q celery"
    working_dir: /code/backend
    environment:
      - WR_LLM_API_KEY=${WR_LLM_API_KEY:-}
      - PYTHONPATH=/code
      - INSTANCE_ID=container
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME}
      - SENTRY_DSN=${SENTRY_DSN}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - MONITORING_EMAIL=${MONITORING_EMAIL}
      - SYSTEM_EMAIL_FROM=${SYSTEM_EMAIL_FROM}
      - CHANNEL_REDIS_HOST=${CHANNEL_REDIS_HOST:-redis}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-amqp://rabbitmq:5672}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis-celery:6379/0}
      - WR_ITEM_UPKEEP_ENABLED=${WR_ITEM_UPKEEP_ENABLED:-true}
      - WR_DOOR_UPKEEP_ENABLED=${WR_DOOR_UPKEEP_ENABLED:-true}
      - COMMUNICATION_RETENTION_DAYS=${COMMUNICATION_RETENTION_DAYS:-3}
      - COMMUNICATION_PRUNE_BATCH_SIZE=${COMMUNICATION_PRUNE_BATCH_SIZE:-10000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      redis-celery:
        condition: service_started
  llm-worker:
    profiles: [ai]
    logging: *default-logging
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A backend.config worker -l info -Q inference -n inference@%h --concurrency=4 --prefetch-multiplier=1
    working_dir: /code/backend
    environment:
      - PYTHONPATH=/code
      - INSTANCE_ID=container
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - WR_LLM_API_KEY=${WR_LLM_API_KEY:-}
      - WR_LLM_OPENAI_PROJECT=${WR_LLM_OPENAI_PROJECT:-}
      - WR_LLM_WORKER=1
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-amqp://rabbitmq:5672}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis-celery:6379/0}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis-celery:
        condition: service_started
  celery-beat:
    logging: *default-logging
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: sh -c "celery -A backend.config beat -l info"
    working_dir: /code/backend
    environment:
      - PYTHONPATH=/code
      - INSTANCE_ID=container
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME}
      - SENTRY_DSN=${SENTRY_DSN}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - MONITORING_EMAIL=${MONITORING_EMAIL}
      - SYSTEM_EMAIL_FROM=${SYSTEM_EMAIL_FROM}
      - CHANNEL_REDIS_HOST=${CHANNEL_REDIS_HOST:-redis}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-amqp://rabbitmq:5672}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis-celery:6379/0}
      - WR_ITEM_UPKEEP_ENABLED=${WR_ITEM_UPKEEP_ENABLED:-true}
      - WR_DOOR_UPKEEP_ENABLED=${WR_DOOR_UPKEEP_ENABLED:-true}
      - COMMUNICATION_RETENTION_DAYS=${COMMUNICATION_RETENTION_DAYS:-3}
      - COMMUNICATION_PRUNE_BATCH_SIZE=${COMMUNICATION_PRUNE_BATCH_SIZE:-10000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      redis-celery:
        condition: service_started
  fastapi:
    logging: *default-logging
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8001:8001"
    command: sh -c "uvicorn fastapi_app.main:app --host 0.0.0.0 --port 8001"
    working_dir: /code
    environment:
      - PYTHONPATH=/code:/code/backend
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-backend.config.settings.container}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - CHANNEL_REDIS_HOST=${CHANNEL_REDIS_HOST:-redis}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-amqp://rabbitmq:5672}
    depends_on:
      - db
      - redis
      - rabbitmq
  frontend:
    logging: *default-logging
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5200:5173"
    command: sh -c "npm install && npm run dev-local -- --host"
    depends_on:
      - backend
  db:
    logging: *default-logging
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
  redis:
    logging: *default-logging
    image: redis:7-alpine
    ports:
      - "6379:6379"
  redis-celery:
    logging: *default-logging
    image: redis:7-alpine
    ports:
      - "6380:6379"
  rabbitmq:
    logging: *default-logging
    image: rabbitmq:3.13-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres_data:
