# Phalanx world 23 Oath Court class services.
# Apply after T1-T3 remort gear, shared craft materials, all remort T2/T3
# recipes, and both T2/T3 salvage overlay files. T1 shops are attached
# directly to their exchange rooms; the inactive Spawn Plan at the end is
# retained only for builders who want the decorative quartermasters present.
apiVersion: v1alpha1
kind: merchantprofile
metadata:
  world: world.23
  slug: warlord-t1-outfitter
  name: Warlord Field Outfitter
spec:
  notes: T1 Warlord field gear for the Oath Court.
  settlement_currency: obol
  pricing:
    sell_markup: 1.0
    buy_multiplier: 0.2
  restock:
    interval_seconds: 300
  funds:
    mode: unlimited
  buyback:
    enabled: true
    max_items: 10
    expires: on_restock
  stock:
    - key: t1-warlord-head
      item_definition: itemdefinition.t1-warlord-head
      count: 1
      refresh: fill_missing
    - key: t1-warlord-body
      item_definition: itemdefinition.t1-warlord-body
      count: 1
      refresh: fill_missing
    - key: t1-warlord-arms
      item_definition: itemdefinition.t1-warlord-arms
      count: 1
      refresh: fill_missing
    - key: t1-warlord-hands
      item_definition: itemdefinition.t1-warlord-hands
      count: 1
      refresh: fill_missing
    - key: t1-warlord-waist
      item_definition: itemdefinition.t1-warlord-waist
      count: 1
      refresh: fill_missing
    - key: t1-warlord-legs
      item_definition: itemdefinition.t1-warlord-legs
      count: 1
      refresh: fill_missing
    - key: t1-warlord-feet
      item_definition: itemdefinition.t1-warlord-feet
      count: 1
      refresh: fill_missing
    - key: t1-warlord-war-spear
      item_definition: itemdefinition.t1-warlord-war-spear
      count: 1
      refresh: fill_missing
