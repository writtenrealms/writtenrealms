apiVersion: writtenrealms.com/v1alpha3
kind: trigger
metadata:
  world: world.65
  id: 311
  key: trigger.311
  name: The Hall of Judgement Trigger
spec:
  scope: room
  kind: event
  target: room@2
  match: ''
  script: ''
  steps:
  - actions:
    - type: command
      command: /lock south The bronze doors close behind you. Nobody touches them.
      subject: trigger_room
    after_seconds: 0
  - actions:
    - type: command
      command: /echo Three men above you, at the top of the stair. The braziers burn without heat, and the light they lay down stops well short of where you are standing.
      subject: trigger_room
    after_seconds: 2
  - actions:
    - type: command
      command: "/echo Minos says 'Name.'"
      subject: trigger_room
    after_seconds: 2
  - actions:
    - type: command
      command: /echo You give it. Aeacus writes.
      subject: trigger_room
    after_seconds: 2
  - actions:
    - type: command
      command: "/echo Minos says 'Which of us?'"
      subject: trigger_room
    after_seconds: 2
  - actions:
    - type: command
      command: /echo Aeacus regards you the way a man regards a column of figures.
      subject: trigger_room
    after_seconds: 2
  - actions:
    - type: command
      command: "/echo Aeacus says 'He went armed. Mine.'"
      subject: trigger_room
    after_seconds: 2
  - actions:
    - type: command
      command: "/echo Minos says 'Read it.'"
      subject: trigger_room
    after_seconds: 2
  - actions:
    - type: command
      command: /echo Aeacus turns the tablet a fraction toward the nearest brazier. It is covered edge to edge in a small, even hand.
      subject: trigger_room
    after_seconds: 2
  - actions:
    - type: command
      command: "/echo Aeacus says 'It is all here. Every hour of it. Shall I begin at the start, or at the parts you were hoping I'd lost?'"
      subject: trigger_room
    after_seconds: 2
  - actions:
    - type: command
      command: /echo Minos finally looks up. His eyes aren't cruel. That's the worst of it — there is nothing personal in them at all.
      subject: trigger_room
    after_seconds: 2
  - actions:
    - type: command
      command: "/echo Minos says 'The dead are not punished, exactly. They are sorted. Rhadamanthys.'"
      subject: trigger_room
    after_seconds: 2
  - actions:
    - type: command
      command: /echo Rhadamanthys rises, and the black doors behind the thrones seem nearer than they were.
      subject: trigger_room
    after_seconds: 2
  - actions:
    - type: command
      command: /echo You understand with your whole body that whatever he says next will be true forever—
      subject: trigger_room
    after_seconds: 2
  - actions:
    - type: command
      command: /echo The bronze doors open.
      subject: trigger_room
    after_seconds: 2
  - actions:
    - type: command
      command: "/echo Hermes says 'Don't.'"
      subject: trigger_room
    after_seconds: 2
  - actions:
    - type: command
      command: /echo Hermes crosses the pavement like a man already late for something else — travel-stained, staff in hand, mud to the ankle.
      subject: trigger_room
    after_seconds: 2
  - actions:
    - type: command
      command: "/echo Hermes says 'Minos. Aeacus. Rhad. Put it down.'"
      subject: trigger_room
    after_seconds: 2
  - actions:
    - type: command
      command: "/echo Minos says 'He is judged.'"
      subject: trigger_room
    after_seconds: 2
  - actions:
    - type: command
      command: "/echo Hermes says 'He's being judged. Different tense.'"
      subject: trigger_room
    after_seconds: 2
  - actions:
    - type: command
      command: /echo Hermes climbs three steps, sits down on the fourth, and leans back on his elbows with the thrones at his shoulder, entirely at ease in a room that contains no ease at all.
      subject: trigger_room
    after_seconds: 2
  - actions:
    - type: command
      command: "/echo Hermes says 'There's a war on. Upstairs they're frightened. You've heard.'"
      subject: trigger_room
    after_seconds: 2
  - actions:
    - type: command
      command: "/echo Minos says 'We do not hear. We weigh.'"
      subject: trigger_room
    after_seconds: 2
  - actions:
    - type: command
      command: "/echo Hermes says 'Then weigh him tomorrow. I need this one.'"
      subject: trigger_room
    after_seconds: 2
  - actions:
    - type: command
      command: /echo Rhadamanthys has not sat down.
      subject: trigger_room
    after_seconds: 2
  - actions:
    - type: command
      command: "/echo Rhadamanthys says 'By whose word?'"
      subject: trigger_room
    after_seconds: 2
  - actions:
    - type: command
      command: "/echo Hermes says 'Guess.'"
      subject: trigger_room
    after_seconds: 2
  - actions:
    - type: command
      command: /echo Nobody answers. Somewhere above the braziers, the dark settles slowly back to where it was.
      subject: trigger_room
    after_seconds: 2
  - actions:
    - type: command
      command: /echo Hermes comes down the steps, puts a hand between your shoulder blades — warm, solid, the first warm thing since you died — and turns you west, toward the passage where the light gives out.
      subject: trigger_room
    after_seconds: 2
  - actions:
    - type: command
      command: "/echo Hermes says 'Walk. Don't look back at them, they hate being looked at afterward.'"
      subject: trigger_room
    after_seconds: 2
  - actions:
    - type: command
      command: /echo Hermes waits at the mouth of the passage for you to go ahead of him.
      subject: trigger_room
    after_seconds: 2
  - actions:
    - type: command
      command: "/echo Hermes says 'There's an offer waiting. I'd hear it out, in your position.'"
      subject: trigger_room
    after_seconds: 2
  - actions:
    - type: command
      command: /echo Hermes glances back up the stair once, without expression.
      subject: trigger_room
    after_seconds: 2
  - actions:
    - type: command
      command: "/echo Hermes says 'I've seen the alternative.'"
      subject: trigger_room
    after_seconds: 2
  - actions:
    - type: command
      command: follow hermes
      subject: trigger_actor
    after_seconds: 0
  on_step_error: cancel
  conditions: ''
  event: enter
  show_details_on_failure: false
  failure_message: ''
  display_action_in_room: false
  gate_delay: 10
  order: 0
  is_active: true
